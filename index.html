<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BOTÃO - ALERTA SISTEMAS </title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-badge">ALERTA • CONTROLE REMOTO</div>
    <h1>Painel de Dispositivos</h1>
    <p>Pressione o botão para gravar</p>
  </header>

  <main id="button-grid" class="button-grid">
    <!-- Renderizado dinamicamente pelo app.js -->
  </main>

  <div id="status-toast" class="toast">Comando disparado!</div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker Ativo!'))
          .catch(err => console.error('Erro no SW:', err));
      });
    }
  </script>
</body>
</html>
